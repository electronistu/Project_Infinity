# Token budgets for the GM's static prefix and its named neighbours.
# Every ceiling here is a decision, not a measurement: raising one needs a reason
# written beside it.
#
# status:
#   enforced  the gate fails (exit 1) when `measure` exceeds `ceiling`
#   target    reported only; flip to `enforced` when the thing it measures exists
#
# `measure` names a metric produced by tools/token_budget.py. A metric that does
# not exist yet resolves to None and is reported as unmeasured (never a pass for
# an enforced row).
#
# Run:
#   venv\Scripts\python.exe tools\token_budget.py --gate
#   venv\Scripts\python.exe tools\verify.py

budgets:
  - name: static_prefix_scenes_on
    ceiling: 10750
    unit: tokens
    status: enforced
    measure: static_prefix_scenes_on
    note: "Raised 10,500 -> 11,000 on 2026-10-08: the original ceiling predated the ERA INDEX and the `lookup` tool it was planning for. Raised 11,000 -> 11,200 on 2026-10-12 for the `end_combat` tool (the explicit end-of-fight call for what the registry derivation cannot see) and its protocol lines. Raised 11,200 -> 11,500 on 2026-10-11 for `register_companion` (a companion's durable, world-bound sheet, declared on demand -- nothing is injected per turn). Raised 11,500 -> 11,650 on 2026-10-11 for the combat-only companion sheet (required ability scores, `advantages`, the check derivation) and the line it adds to `perform_check`; 11,588 measured. LOWERED 11,650 -> 10,800 on 2026-10-12 by the error-driven docs trim (~600 tok of declarations the tool returns already teach) plus the on-demand `lookup('ref:TOOL')` references (~320 tok moved off the prefix). LOWERED 10,800 -> 10,650 the same day by Phase 2b: `update_player_list`'s 18 flat ability aliases (`set_*`/`*_bonus`/`*_bonus_max`) are dropped from the prompt schema (`web/tool_schema.py:_HIDDEN_PROPERTIES`) -- a duplicate spelling whose capability stays reachable through the visible `effects` route, which `equipment.item_effects` treats identically; schema 499 -> 310. Set to measured + ~100 (rounded to 50), not banked; 10,501 measured. Raised 10,550 -> 10,750 on 2026-10-12 for `read_player_field` (the GM's per-field read: a value the CHARACTER SHEET omits, above all `stats`, or a companion's whole sheet; the `update_player_list` field catalogue moved into its docstring); 10,629 measured. Raised 10,750 -> 10,800 on 2026-10-13 for `register_combatants`'s `names` group (one shared stat block for many identical mooks -- a FIELDS line plus a mixed single+group EX); 10,753 measured. From 2026-10-10 the measurement applies `filter_tools`, so a hidden tool is never counted (see the row below). LOWERED 10,800 -> 10,750 on 2026-10-16: the `STATE: RECOVERY` state machine (8 lines, 120 tok, never taken in the live runs and self-disclaiming in its own step 0) became a 2-step rule (53 tok) and INVARIANT 6 shrank with it -- 61 tok back on this row and the next two; 10,613 measured, so the headroom is a decision again."

  - name: static_prefix_scenes_off
    ceiling: 10050
    unit: tokens
    status: enforced
    measure: static_prefix_scenes_off
    note: "The same prefix with the scene blocks stripped (images off). Lowered 11,200 -> 10,000 on 2026-10-12 with the scenes-on row (docs trim + on-demand references), then 10,000 -> 9,800 with Phase 2b (the hidden ability aliases); 9,688 measured. Raised 9,750 -> 9,950 on 2026-10-12 for `read_player_field`; 9,823 measured. Raised 9,950 -> 10,000 on 2026-10-13 for `register_combatants`'s `names` group; 9,947 measured. From 2026-10-10 it also drops the tools `filter_tools` hides with images off (`request_scene_image`, `register_npcs`) and counts the text-only `note_place` row it instead offers -- correcting a ~1.1k over-count. 9,953 measured on 2026-10-16: `note_place`'s WHEN now tells the GM to declare on MOVEMENT -- a place new to the story OR a return to one it already knows -- which is what keeps the engine's current place, its arrival and the primed block in step. The row has ~47 tok of headroom left, so the next addition to this tool's description is a ceiling decision. LOWERED 10,000 -> 9,950 on 2026-10-16 by the recovery rewrite (61 tok); 9,892 measured. RAISED 9,950 -> 10,050 on 2026-10-18: `note_place` now states the roster DELTA and the regular's free-text `state` ('dead' / 'petrified' / 'gone', one short word) -- the rules that let the per-turn echo be a one-line declaration and keep a re-declared roster from losing its people -- 9,980 measured on the final wording."

  - name: static_prefix_classic
    ceiling: 10300
    unit: tokens
    status: enforced
    measure: static_prefix_classic
    note: "The other game's prefix, measured separately: the classic protocol wording (no era rules) and the whole tool list. Lowered 11,200 -> 10,350 on 2026-10-12 with the rows above, then 10,350 -> 10,200 with Phase 2b; 10,070 measured. Raised 10,100 -> 10,300 on 2026-10-12 for `read_player_field` (offered in classic too); 10,198 measured. Raised 10,300 -> 10,350 on 2026-10-13 for `register_combatants`'s `names` group; 10,300 measured. It now INCLUDES the `lookup` row: `lookup` is the one generic read-only tool and is offered in classic too, for its on-demand `ref:TOOL` reference (the era branches simply have no other era to reach). LOWERED 10,350 -> 10,300 on 2026-10-16 by the recovery rewrite (the same 61 off this prefix too)."

  - name: era_index
    ceiling: 150
    unit: tokens
    status: enforced
    measure: era_index
    note: "The always-on ERA INDEX: id, the exact year (`meta.when`) and a one-line character. 96 tok today, up from 76 when the year was added (the year is what the GM dates every scene by, and it is why a state page carries no `year:`). It lives in the static prefix."

  - name: lookup_schema
    ceiling: 100
    unit: tokens
    status: enforced
    measure: lookup_schema
    note: "S0.3 - the whole `lookup` tool row (description + schema), which is what enters the prefix. Raised 90 -> 100 on 2026-10-12: the row now also points at the on-demand tool references (`ref:TOOL`), which bought ~320 tok of prefix removal for ~3 tok here; 92 measured. Still deliberately tight, so growth is a decision."

  - name: tool_ref_update_player_list
    ceiling: 350
    unit: tokens
    status: target
    measure: tool_ref_update_player_list
    note: "The on-demand `lookup('ref:update_player_list')` body -- the `effects` type/`when` vocabulary, the `ability_set`/`ability_bonus` shapes, and the note that the flat ability aliases are still accepted though hidden from the schema. NOT always-on: paid only on the turns it is fetched, so a `target` row keeps growth visible without bounding the prefix. 309 today."

  - name: tool_ref_resolve_magic
    ceiling: 240
    unit: tokens
    status: target
    measure: tool_ref_resolve_magic
    note: "The on-demand `lookup('ref:resolve_magic')` body -- the spell resolution rules, moved off the always-on description. NOT always-on: paid only when fetched. 196 today."

  - name: era_scaffold
    ceiling: 450
    unit: tokens
    status: enforced
    measure: era_scaffold
    note: "The largest era scaffold, fetched once per era via lookup."

  - name: place_tree
    ceiling: 490
    unit: tokens
    status: enforced
    measure: place_tree
    note: "S0.3 - KNOWN PLACES: the CURRENT area only, capped at 12 places PER AREA (the bound the player's place picker already uses, so a settlement walked all over cannot crowd out the place the story stands in), NPC roles dropped, <= 2 names per place, the current place marked, plus one anchor line per other area. Rewritten in place when the GM moves. 280 measured on 2026-10-16 with the whole-era tree replaced by the current area alone; RAISED 400 -> 460 on 2026-10-16 after a LIVE probe showed why the anchor lines are needed: given only an area name, deepseek-v4.1-flash invented a path for a place the save already held and once filed a Wapping place under the area it stood in -- with one exact place per other area in the block it reused the stored path in 2/2 runs. The row now measures the area cap AND the anchor cap (12 + 6 anchors = 421 measured); before, it never rendered an anchor at all. Anchors appear only when the save has stood in another area, so a single-area save pays the 280 case. RAISED 460 -> 490 on 2026-10-18: a regular's `state` renders in the block (`Name (dead)`), so the synthetic worst case carries one per place -- 456 measured."

  - name: era_file_bytes
    ceiling: 5120
    unit: bytes
    status: enforced
    measure: era_file_bytes
    note: "S0.3 - largest config/eras/*.yml (5 KB); unused eras are never injected."

  - name: tool_results_gm_view
    ceiling: 300
    unit: tokens
    status: enforced
    measure: tool_results_gm_view
    note: "A representative per-turn tool-result set as the GM sees it -- the two heaviest mechanics results (a multi-projectile spell + an attack that kills, awards XP and writes HP), projected through `_gm_tool_view`. 233 today; the same raw results were 803 before the projection was fixed (it had been fail-open for `resolve_magic`/`resolve_attack`). Enforced so the per-turn half cannot drift again the way it did while this row read 'needs instrumentation'."

  # Not a budget row: the honest per-turn floor -- static prefix + the current era's
  # scaffold + the place tree, i.e. everything re-sent every turn until a compaction.
  # Report-only BY DESIGN: it is a transparency row, so drift is visible without
  # inventing a ceiling whose only purpose would be to restate its parts' ceilings.
  - name: always_on_total
    ceiling: null
    unit: tokens
    status: target
    measure: always_on_total
    note: "Not a S0.3 row: the honest per-turn floor (prefix + scaffold + place tree). Report-only by design."

  - name: always_on_total_classic
    ceiling: null
    unit: tokens
    status: target
    measure: always_on_total_classic
    note: "The classic game has no era to fetch and no place tree keyed by era, so its floor is just its prefix. Report-only, and it is the number the classic game actually pays every turn."

  - name: injected_timeline
    ceiling: 1220
    unit: tokens
    status: enforced
    measure: injected_timeline
    note: "The injected SESSION_TIMELINE body at its cap (web/engine.py MAX_TIMELINE_CHARS = 4500): the engine's COMPANIONS line + the current age's STATE page + chronicle + kept entries. 1,206 today at the cap. This is a cap-bound worst case, so retiring the traveller page shows up as fewer tokens in a real (under-cap) session, not here. Compaction (web/engine.py _compact_timeline) keeps it bounded; the ceiling fails the gate if the cap is raised."

  - name: injected_sheet
    ceiling: 480
    unit: tokens
    status: enforced
    measure: injected_sheet
    note: "The engine-injected lean CHARACTER SHEET block (web/engine.py `_sheet_body` + `_companions_block`), set once at session build and re-injected at every jump -- never appended per turn. It replaces the GM's `dump_player_db` fetch, which was ~2,248 tok in context every turn for a level-20 caster. 445 measured at worst case: a level-20 caster plus the three companions of one world (name, identity and the capped look). It carries the fields the GM reads and the key-sets it addresses writes with; the combat math the engine owns (stats/saves/skills/proficiencies/AC/hit dice, the `_carrying`/`_equipment` internals) and the spell lists (the engine enforces spell knowledge now) are never shown."
