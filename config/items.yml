- {key: incense, name: Sticks of Incense, aliases: [5 sticks of incense, 5 sticks of incense, incense]}
- {key: artisan-s-tools, name: Artisan's Tools, aliases: [a set of artisan's tools, a set of artisan's tools (one of your choice)]}
- {key: rations, name: Rations, aliases: [a day of rations, one day of rations]}
- {key: rope, name: Rope, aliases: [hempen rope, 50 feet of hempen rope]}
- {key: torch, name: Torch}
