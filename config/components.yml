# Used by resolve_magic's free-hand check: S needs a free hand; M is satisfied by a free hand
# (a component pouch) or a held focus, which can be the same hand as the somatic one. V-only
# spells need no hand at all. Spells absent here are treated as needing a hand (V,S,M) and the
# GM can override per cast with components='...' — the same "catalog + GM declaration" pattern
# as weight= on update_player_list.
