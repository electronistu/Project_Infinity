body:
  history:
    - The 1801 union holds England, Scotland and Ireland under one parliament at Westminster, and the Irish question pulls at it.
    - Railways, the telegraph and the Press move people, goods and rumour faster than any century before. The Empire runs on the docks, the mills and the ships.
    - "The Great Exhibition opened under glass in 1851; the famine in Ireland is a decade old and not forgotten."
