body:
  history:
    - Chang'an is the largest city in the world and the eastern end of the Silk Road. Its wards are a grid of walls and gates, and at dusk the drums close them.
    - "The examination bureaucracy, the Buddhist monasteries and the foreign merchants all answer to one throne. The frontier commands grow strong enough to break it: An Lushan rebels in 755."
    - "At Talas in 751 the Tang met the Abbasids, and paper-makers travelled west with the prisoners."
  polities:
    - name: the Tang empire
      ruler: Emperor Xuanzong
      capital: Chang'an
      relations:
        the Tibetan Empire: "war on the western frontier"
        the Uyghurs: "horses for silk"
        the Abbasid Caliphate: "rivals at Talas in 751"
        Silla and Japan: "tribute and imitation"
      factions:
        - {name: the imperial bureaucracy, key: bureaucracy}
        - {name: the Buddhist monasteries, key: monasteries}
        - {name: the market guilds of Chang'an, key: market_guilds}
        - {name: the Silk Road caravans, key: caravans}
        - {name: the poets' circles, key: poets}
    - name: the frontier commands
      ruler: An Lushan of Fanyang
      capital: the northern circuits
      relations:
        the Tang court: "obedient on paper"
        the Khitan and the Xi: "raiding, and bought off"
        the Tibetan Empire: "the same frontier"
      factions:
        - {name: the jiedushi, key: jiedushi}
        - {name: the frontier garrisons, key: garrisons}
  visual_hooks:
    - the walled grid of Chang'an
    - the drums closing the wards at dusk
    - a pagoda above the ward walls
    - camels at the western gate
