# Image generation config for Project Infinity (web client).
#
# Provider: Google Gemini (Nano Banana family) via google-genai.
# Images are ONE-OFF CACHED ASSETS (character portrait now; stat/item icons
# later) — never real-time scene illustration. Each save gets its own folder
# under output/images/{stem}/ and an asset is regenerated only on request or
# when the source fields it was built from change.
#
# Use GA model ids only. The `-preview` ids were retired 2026-06-25;
# `gemini-2.5-flash-image` retires 2026-10-02. Lite is 1K-only.
#
# `model` is the DEFAULT for in-story images (character portrait + storyline
# scenes): scenes feed a location reference plus the portrait, and Nano Banana 2
# handles multiple references far better than Lite. `icon_model` is the DEFAULT
# for sheet icons (single subject, no references) where Lite is cheapest.
model: gemini-3.1-flash-image
icon_model: gemini-3.1-flash-lite-image
aspect_ratio: "3:4"
image_size: "1K"

# Locked art direction so every asset in a save looks like it belongs to one
# game. Gemini will happily render text, so forbid it explicitly.
style: >-
  Painterly dark-fantasy illustration in the style of a tabletop RPG sourcebook:
  muted candlelit palette (umber, oxblood, tarnished brass), soft oil-brush
  texture, grounded and gritty, naturalistic proportions, dramatic soft
  side-lighting, shallow depth of field. Absolutely no text, letters, numbers,
  runes, watermarks, logos, borders or user-interface elements.

# Portrait prompt template. {alignment} {gender} {race} {class} {gear}
# {background_line} are filled from the character's .player data.
portrait: >-
  {reference_line} Head-and-shoulders character portrait of a {alignment} {gender} {race}
  {class}. {level_line} {gear} {background_line} Single subject, centred, facing the viewer,
  plain dark background, no other people.

# Portraits render at up to ~260px; 512 keeps them sharp and ~4x smaller.
portrait_max_side: 512

# Always appended to a portrait prompt: the subject wears exactly the gear listed
# ({gear} comes from the character's equipped set), and nothing may be invented.
portrait_guard: >-
  The subject wears and wields exactly the equipment listed, nothing more — do not add or
  invent any garment, armour, weapon, hood, cloak, hat, helmet or accessory, and never
  depict gear that is not described.

# ── Storyline scene images (16:9 cinematic) ──
# Two images per place: a hidden, permanent, EMPTY establishing "seed" per
# (location, sublocation), and a visible "action" image drawn FRESH from that seed
# + the portrait every time. Actions are never used as references for later
# actions — chaining made the model duplicate the figures already in the frame —
# and each action file is served once, then deleted. The seed is never shown to
# the player and is the only persisted scene asset.
scene_aspect_ratio: "16:9"
scene_max_side: 1024

# Hidden establishing "seed" prompt. Placeholders: {location} {sublocation}
# {establishing} {world} (and {change} when regenerating after a permanent change).
# It is the only place reference for every action, so it is framed at eye level:
# a bird's-eye seed would pull every action shot into a top-down.
scene_seed: >-
  A wide establishing view of {address_line}, seen at eye level or a slight three-quarter
  angle. {establishing} World setting: {world}. Empty and unpopulated — no people, no
  creatures, no animals, no protagonist. Timeless and weather-neutral: no rain, snow, fog, mist
  or time-of-day light (no dawn, dusk or night); the light is neutral. Atmospheric, strong sense
  of place, painterly detail. No text, letters, numbers, runes, watermarks, logos, borders or
  user-interface elements.
scene_seed_guard: >-
  The scene must contain no person, no creature and no animal of any kind — an empty place.
scene_seed_change: >-
  Apply this permanent change to the place: {change}. Keep the architecture, layout, colours
  and everything else consistent with the attached image.

# Visible action prompt. Placeholders: {location_line} {description} {protagonist_line}
# {race} {class} {gear} {world} {address_line} {mood}. The locked `style:` above is appended.
scene: >-
  {location_line} A cinematic widescreen illustration of this moment: {description}
  {protagonist_line} Location: {address_line}. World
  setting: {world}. {atmosphere_line} {characters_line} Mood: {mood}. Wide establishing
  composition, dramatic atmospheric lighting, sense of place and depth, painterly detail. No
  text, letters, numbers, runes, watermarks, logos, borders or user-interface elements.
# The normal protagonist sentence, used when no appearance-changing effect is active.
scene_protagonist: "The protagonist is a {race} {class}. {gear}"
# Used INSTEAD of scene_protagonist while an appearance-changing effect is active (Disguise Self,
# Alter Self, Seeming): the effect's look text replaces race/class/gear and the portrait is not fed.
scene_appearance_line: >-
  The protagonist's appearance is currently: {appearance} Draw exactly that appearance; the
  protagonist's usual face, hair, build and clothing are hidden by the illusion.
# Appended when the effect's illusion also covers gear (Disguise Self, Seeming — SRD).
scene_appearance_gear: >-
  The illusion covers clothing, armour and weapons: depict only the garments and gear described
  in that appearance, never the protagonist's usual equipment.
# Which active effects change the protagonist's appearance, and whether they cover gear.
# true = the SRD illusion includes clothing/armor/weapons; false = the physical form only.
appearance_effects:
  disguise self: true
  seeming: true
  alter self: false
# Explicit time/weather from the GM's `time_of_day` / `weather` fields; a part is
# omitted when the field is empty.
scene_time_line: "Time of day: {time_of_day}."
scene_weather_line: "Weather: {weather}."
# Cast list from the GM's `characters` dict (one bullet per entry); the guard is
# appended when any character is listed.
scene_characters_line: >-
  Characters present (render each exactly as described; add no one else):
scene_characters_guard: >-
  Render every listed character exactly as described — a described woman must not be drawn as
  a man — and add no character who is not listed.
# Attached when the action is drawn from the place's hidden establishing view: the seed
# IS the picture — the action reproduces it and only places the cast into it.
scene_action_from_seed: >-
  Attached references: (1) the establishing view of {location} — {sublocation}: this IS the
  picture — reproduce it unchanged (same camera, framing, architecture, furniture, props,
  colours, arrangement), then place the characters into it. Change nothing about the space
  itself, except the three things the moment legitimately changes: the time of day (relight the
  same scene for day or night), the weather (rain, fog, snow, wind — the same room under a
  different sky), and the action's own transient damage or mess — a table split, a chair toppled,
  a hearth scattered, spilled ale, a fire. Objects the action touches may be broken or displaced;
  the room is never rearranged. (2) the protagonist's portrait — that same character, in the
  described action.
# Same, but with NO portrait attached (an appearance-changing effect is active): only the seed.
scene_action_from_seed_solo: >-
  Attached reference: the establishing view of {location} — {sublocation}: this IS the picture
  — reproduce it unchanged (same camera, framing, architecture, furniture, props, colours,
  arrangement), then place the characters into it. Change nothing about the space itself,
  except the three things the moment legitimately changes: the time of day (relight the same
  scene for day or night), the weather (rain, fog, snow, wind — the same room under a different
  sky), and the action's own transient damage or mess — a table split, a chair toppled, a hearth
  scattered, spilled ale, a fire. Objects the action touches may be broken or displaced; the
  room is never rearranged.
# Appended to every action prompt: removing the previous-action reference stops the
# model COPYING a figure, but not its habit of FILLING a room.
scene_no_extra_figures: >-
  Draw only the protagonist and the characters listed above: no other person, face,
  silhouette, figure, reflection or background crowd may appear.
# Appended to every action prompt: the frame is candid — nobody addresses the camera,
# and every figure faces the action (seen from behind when it is in front of them).
scene_no_camera_gaze: >-
  No one looks at, faces or acknowledges the camera or the viewer — every figure is caught
  mid-action, absorbed in what they are doing and facing into the scene; every figure faces the
  ACTION at hand, and a figure seen from behind, back to the camera, is correct whenever the
  action is in front of them.
# Appended to every action prompt: match the declared light — night is TRUE night.
scene_lighting_guard: >-
  Match the declared time of day exactly. At night or deep night draw true night: deep darkness
  over everything except the local light sources — a fire, a lamp, a lantern, a moonlit doorway —
  each throwing only a small pool of light around itself. No twilight, no dusk glow, no sunset
  colours, no ambient daylight, no blue hour.
# Appended when the action is drawn from the place's seed: lock the space AND the camera.
scene_layout_lock: >-
  The attached establishing view IS the scene: keep the same camera, framing, crop, architecture,
  walls, doors, windows, stairs, furniture, props, their positions, scale and proportions. Do not
  redesign, add, remove, resize, restyle or rearrange anything, and do not change the viewpoint,
  the framing or the composition. Only what the moment legitimately changes may differ: the time
  of day (relight this identical scene for day or night), the weather (atmosphere only — it never
  alters the space), and the transient damage or mess of the action (a table split, a chair
  toppled, a fire, spilled ale). Then place the characters into that same space.
# Appended with the layout lock: the seed image is the only source of the space — never
# invent architecture it does not show, and drop a character who needs a missing element.
scene_absent_element_guard: >-
  The attached establishing view is the ground truth for the space: never invent an element it
  does not show — no new door, doorway, window, opening, stair, beam, fixture or furniture. Place
  characters only where that view allows; if a character is described at a spot it does not
  contain (standing in a doorway that is not there), move them into the closest visible place; if
  that is impossible, leave them out of the picture. This applies to every figure, the protagonist
  included: never invent a place to keep them in frame.

# Reference images (the seed / portrait) are input tokens; keep them small and cap
# the model's resolution budget for them.
ref_max_side: 512
ref_media_resolution: "MEDIA_RESOLUTION_MEDIUM"
# Used when only the protagonist's portrait is attached as a reference.
scene_portrait_reference_line: >-
  The attached portrait is the protagonist — keep the same face, hair colour and build; place that
  character in the described action and pose.
# Always appended when the portrait is attached: stop the GM's text from
# overriding the portrait's appearance OR adding gear the character does not have.
scene_protagonist_guard: >-
  The protagonist's appearance is fixed by the attached portrait — do not restate or
  alter their face, hair, build or clothing from the text; depict the scene around them.
  In the scene the protagonist does not look at or address the camera — turn them into the
  action despite the portrait's frontal pose: they face whatever they are doing, not the lens,
  and the camera may see their back. Never rotate the protagonist toward the camera to match
  the portrait.
  The protagonist wears only the equipment shown in that portrait: ignore or omit any
  garment, armour, weapon or accessory the text names that the portrait does not show,
  and never add a hood, hooded cloak, cowl, hat, helmet or armour that is not in it.

# ── Shared icon library (cross-character, committed under assets/icons/) ──
icon_max_side: 256
# The dark character-sheet card colour. Icons are generated and post-processed
# to this EXACT background so their subjects appear to float on the dark sheet;
# the sheet cards already use --surface #1e1a13.
icon_background: "#1E1A13"
# Auto-fit: scale the subject so its longest side fills this fraction of the
# frame (generated art tends to sit small in a sea of background).
icon_fill: 0.92
icon_style: >-
  Flat codex emblem on a dark ground: bold uniform pale-bone linework, limited
  palette of warm bone highlights, umber mid-tones and a single ember-red accent,
  set on a flat solid #1E1A13 background that exactly matches the dark character
  sheet; the subject contrasts strongly with that background. High contrast,
  legible at 64 pixels. No gradients, no glow, no drop shadows, no paper grain,
  no text, no letters, no numbers, no runes, no watermarks, no frame. A single
  centred subject.

# Per-kind icon prompt templates. Placeholders: {name} {detail}
icon:
  weapon: "A single {name}, shown whole and upright. {detail}"
  armor: "A piece of {name}, front view. {detail}"
  tool: "A single {name}, laid out neatly. {detail}"
  skill: "An emblem for the '{name}' skill. {detail}"
  language: "A script sigil representing the {name} language."
  spell: "A magical sigil for the spell '{name}'. {detail}"
  school: "A heraldic emblem for the school of {name}."
  feature: "An emblem for the trait '{name}'. {detail}"
  damage: "A symbol for {name} damage."
  condition: "A symbol for the '{name}' condition."
  item: "A single {name}. {detail}"
  kingdom: "A heraldic crest for the realm of {name}."
  faction: "A heraldic sigil for the {name} faction."
  race: "A heraldic emblem for the {name} people."
  class: "A heraldic emblem for the {name} class."
  background: "A heraldic emblem for the {name} background."
  alignment: "An emblem for the {name} alignment."
  ability: "An emblem representing the {name} ability score."
  save: "A warded shield emblem for the {name} saving throw."
  stat: "An emblem for the game stat '{name}'."
