# SRD 5.1 equipment weights (pounds), used for carrying capacity / encumbrance.
#
# Source: System Reference Document 5.1 (CC-BY-4.0) — Armor, Weapons, Adventuring
# Gear, Tools and Equipment Packs tables. One entry per item; `aliases` catch the
# SRD's alternate spellings (e.g. "Crossbow, light" vs the project's "Light
# Crossbow"). Matching is exact-after-normalising (case, punctuation, quantities,
# parentheses, leading article) — deliberately NOT fuzzy, so unknown homebrew loot
# falls through and the GM declares its weight. A trailing plural is folded onto the
# singular key (the Forge stores "Two Daggers" as consumables.Daggers).
#
# `per:` marks an SRD *bundle* line (20 arrows weigh 1 lb). A count in the player's
# `consumables` map is a number of UNITS, so the bundle size is divided out there;
# as an inventory item the line weighs its full bundle weight.
#
# Packs are the sum of their SRD contents (the SRD prices packs but gives no pack
# weight); the sum is noted per entry so it can be audited.

